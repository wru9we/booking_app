services:
  db:
    image: postgres:15
    container_name: booking_db
    env_file:
      - .env-non-dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: booking_redis
    ports:
      - "6379:6379"
  booking:
    build:
      context: .
    container_name: booking_app
    env_file:
      - .env-non-dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000
    ports:
      - "7777:8000"

  celery:
    image: booking_celery
    build:
      context: .
    container_name: booking_celery
    env_file:
      - .env-non-dev
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - celery -A tasks.celery:celery worker -l INFO

  flower:
    image: booking_flower
    build:
      context: .
    container_name: booking_flower
    env_file:
      - .env-non-dev
    depends_on:
      redis:
        condition: service_started
      celery:
        condition: service_started
    command: 
      - /bin/sh
      - -c
      - celery -A tasks.celery:celery flower
    ports:
      - "5555:5555"
    
  prometheus:
    image: prom/prometheus:v2.43.0
    container_name: booking_prometheus
    depends_on:
      booking:
        condition: service_started
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:9.4.7
    container_name: booking_grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    ports:
      - "3000:3000"