global:
  scrape_interval: 15s

  external_labels:
    monitor: "booking-monitor"

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "booking"
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["booking:8000"]
